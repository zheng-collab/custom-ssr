# Builds installers for every platform and, on a version tag, publishes them as a GitHub Release.
#
#   git tag v1.0.1 && git push origin v1.0.1      -> Release "v1.0.1" with:
#       SecureGateway-Setup.exe, SecureGateway-win-x64.zip,
#       SecureGateway-macos-arm64.dmg, SecureGateway-macos-x64.dmg
#   The tag also becomes the product version shown in the installer, the About tab and
#   the .app bundle, so Directory.Build.props never has to be edited for a release.
#
# Every push / pull request just builds (and runs the headless UI test) so breakage is caught early.
# "Run workflow" in the Actions tab builds on demand and keeps the files as workflow artifacts.

name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test-ui:
    name: Headless UI test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run headless smoke test
        run: dotnet run --project tests/SecureGateway.Mac.Smoke -c Release -- "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/smoke/*.png
          if-no-files-found: warn
        continue-on-error: true

  windows:
    name: Windows installer + zip
    runs-on: windows-latest
    # Code signing with the company certificate (docs/ANTIVIRUS.md). Without these two
    # repository secrets the build still works, but the Windows files are unsigned.
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Use the tag as the product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i "s#<Version>.*</Version>#<Version>${GITHUB_REF_NAME#v}</Version>#" Directory.Build.props && cat Directory.Build.props
      - name: Load the code-signing certificate
        id: cert
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $cert = New-Object Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:SIGN_PFX_PASSWORD)
          # The certificate is self-signed: trust it on this runner so "signtool verify /pa" passes.
          foreach ($name in 'Root', 'TrustedPublisher') {
            $store = New-Object Security.Cryptography.X509Certificates.X509Store($name, 'LocalMachine')
            $store.Open('ReadWrite'); $store.Add($cert); $store.Close()
          }
          $cer = Join-Path $env:RUNNER_TEMP 'SecureGateway-CodeSign.cer'
          [IO.File]::WriteAllBytes($cer, $cert.Export('Cert'))
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "cer=$cer" >> $env:GITHUB_OUTPUT
          Write-Host "Signing as $($cert.Subject), thumbprint $($cert.Thumbprint), valid until $($cert.NotAfter)"
      - name: Warn when a release is built unsigned
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN_PFX_BASE64 == ''
        shell: bash
        run: echo "::warning title=Unsigned release::Secret SIGN_PFX_BASE64 is not set, so this release's Windows files are NOT signed. See docs/ANTIVIRUS.md."
      - name: Build, publish, package
        shell: pwsh
        run: |
          $pfx = '${{ steps.cert.outputs.pfx }}'
          if ($pfx) { .\scripts\build.ps1 -Installer -Zip -SignCert $pfx } else { .\scripts\build.ps1 -Installer -Zip }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Publish the public half of the certificate with the release, for trust-cert.ps1 on staff PCs.
          if ('${{ steps.cert.outputs.cer }}') { Copy-Item '${{ steps.cert.outputs.cer }}' build\ }
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'sign.pfx')
      # GitHub's artifact service occasionally times out (CreateArtifact request timeout);
      # a second attempt after a pause almost always succeeds. compression-level 0: the
      # files are already compressed, so this only wastes time.
      - id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows
          path: |
            build/SecureGateway-Setup.exe
            build/SecureGateway-win-x64.zip
            build/SecureGateway-CodeSign.cer
          if-no-files-found: error
          compression-level: 0
      - if: steps.upload.outcome == 'failure'
        name: Retry artifact upload
        shell: bash
        run: sleep 60
      - if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/SecureGateway-Setup.exe
            build/SecureGateway-win-x64.zip
            build/SecureGateway-CodeSign.cer
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  macos:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Use the tag as the product version
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i '' "s#<Version>.*</Version>#<Version>${GITHUB_REF_NAME#v}</Version>#" Directory.Build.props && cat Directory.Build.props
      - name: Build .app and .dmg
        run: ./scripts/build-mac.sh --arch ${{ matrix.arch }}
      - id: upload
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: macos-${{ matrix.arch }}
          path: build/SecureGateway-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
      - if: steps.upload.outcome == 'failure'
        name: Retry artifact upload
        run: sleep 60
      - if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/SecureGateway-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-ui, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Add the staff manual next to the installers
        run: mkdir -p dist/docs && cp USER_MANUAL_ZH.pdf dist/docs/
      - name: Write SHA256SUMS.txt so downloads can be verified
        run: |
          (cd dist && sha256sum windows/* macos-arm64/* macos-x64/* docs/* | sed 's#  [^ ]*/#  #') > dist/docs/SHA256SUMS.txt
          cat dist/docs/SHA256SUMS.txt
      - name: List files
        run: find dist -type f | sort
      - name: Create release (or add files to an existing one) and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # The release may already exist when the tag was created from GitHub's
          # "Draft a new release" page; then just attach the files to it.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/windows/* dist/macos-arm64/* dist/macos-x64/* dist/docs/*
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SecureGateway $TAG" \
              --generate-notes \
              dist/windows/* dist/macos-arm64/* dist/macos-x64/* dist/docs/*
          fi
